# Immergas Magis Pro / Combo F1/F2 (Samsung NASA) - package "f1f2_diagnostics"
# Undecoded PDUs (RAW, diagnostic - help decoding them: PDU_MAP.md), bus statistics and the bus sniffer.
# Part of jotuera/immergas-magis-pro-combo-f1f2-nasa (MIT). Loaded by the main YAML through `packages:`.
# File, id and substitution names start with f1f2_ so this repo can be combined with the D+/D- and T-/T+
# repos on one device.

sensor:
  # undecoded values
  - {platform: f1f2_nasa, key: raw_0402, id: f1f2_raw_0402}
  - {platform: f1f2_nasa, key: raw_0411, id: f1f2_raw_0411}
  - {platform: f1f2_nasa, key: raw_0412, id: f1f2_raw_0412}
  - {platform: f1f2_nasa, key: raw_0413, id: f1f2_raw_0413}
  - {platform: f1f2_nasa, key: raw_0414, id: f1f2_raw_0414}
  - {platform: f1f2_nasa, key: raw_0415, id: f1f2_raw_0415}
  - {platform: f1f2_nasa, key: raw_4006, id: f1f2_raw_4006}
  - {platform: f1f2_nasa, key: raw_440a, id: f1f2_raw_440a}
  # 0x428D decoded as "night_mode" (binary) + a night-capacity-% template sensor in f1f2_indoor.
  - {platform: f1f2_nasa, key: raw_041b, id: f1f2_raw_041b}
  - {platform: f1f2_nasa, key: raw_8201, id: f1f2_raw_8201}
  - {platform: f1f2_nasa, key: raw_823f, id: f1f2_raw_823f}
  - {platform: f1f2_nasa, key: raw_8243, id: f1f2_raw_8243}
  - {platform: f1f2_nasa, key: raw_824b, id: f1f2_raw_824b}
  - {platform: f1f2_nasa, key: raw_824c, id: f1f2_raw_824c}
  - {platform: f1f2_nasa, key: raw_82e1, id: f1f2_raw_82e1}
  # 0x80B1 decoded as the "night limit" binary_sensor in f1f2_outdoor (was raw here).
  - {platform: f1f2_nasa, key: raw_840f, id: f1f2_raw_840f}
  - {platform: f1f2_nasa, key: raw_8417, id: f1f2_raw_8417}
  # bus statistics
  - {platform: f1f2_nasa, type: rx_frames}
  - {platform: f1f2_nasa, type: bad_frames}
  - {platform: f1f2_nasa, type: tx_frames}
  - {platform: f1f2_nasa, type: timeouts}

text_sensor:
  - {platform: f1f2_nasa, key: raw_4604, id: f1f2_raw_4604}
  # sniffer output (only while the sniffer switch is on)
  - {platform: f1f2_nasa, type: last_frame}
  - {platform: f1f2_nasa, type: last_change}

switch:
  - platform: f1f2_nasa   # bus sniffer: logs every value change (tag "f1f2_sniff"), whole frames at DEBUG level
  # discovery: like the sniffer value-change log, but each line also carries a snapshot of the reference
  # signals (comp / mode / defrost / night / 3-way / outdoor temp) - feed the log to tools/sniffer_correlate.py
  - platform: template
    name: "${f1f2_name_prefix}${n_f1f2_discovery}"
    icon: "mdi:magnify-expand"
    entity_category: diagnostic
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - lambda: "id(f1f2_hub).set_discovery_enabled(true);"
    turn_off_action:
      - lambda: "id(f1f2_hub).set_discovery_enabled(false);"
