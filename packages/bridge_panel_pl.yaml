# Immergas Magis Pro / Combo F1/F2 (Samsung NASA) bridge - pakiet "bridge_panel" (polski)
# Żywy podgląd kluczowych odczytów, które pokazuje przewodowy panel Samsung MWR-WW10N: temperatury wody,
# zbiornika CWU, EVA, tłoczenia, temp. zewnętrzna, sprężarka, pompa, tryb pracy. TYLKO ODCZYT (bez Arm).
# Wybierz JEDEN: bridge_panel_pl | bridge_panel_en. OPT-IN: jeśli na tym samym urządzeniu działa czytnik
# immergas-magis-pro-combo-f1f2-nasa, część tych wartości już tam jest (unikaj duplikatów - włącz jeden).
#
# Skalowanie: read_value() zwraca surową wartość (bez znaku/skali); temperatury to int16 ×0,1 °C, 0xFFFF i
# 0xFE0C = brak czujnika → NaN. Kody panelu są odpytywane szybciej niż katalog (naprzemiennie w komponencie),
# więc odświeżają się co ~kilkanaście sekund, gdy "Emuluj panel" (auto-poll) jest ON.

sensor:
  - platform: template
    name: "Temp. zewnętrzna (ODU)"
    device_class: temperature
    state_class: measurement
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    update_interval: 10s
    lambda: |-
      float r = id(nasa).read_value(0x8204);
      if (isnan(r)) return NAN;
      uint16_t u = (uint16_t) r; if (u == 0xFE0C) return NAN;
      return (int16_t) u / 10.0f;
  - platform: template
    name: "Temp. wody - powrót"
    device_class: temperature
    state_class: measurement
    unit_of_measurement: "°C"
    accuracy_decimals: 1
