  - platform: template
    name: "Częstotliwość sprężarki"
    state_class: measurement
    unit_of_measurement: "Hz"
    accuracy_decimals: 0
    update_interval: 10s
    lambda: "return id(nasa).read_value(0x8238);"
  - platform: template
    name: "Limit Hz sprężarki (0x8239)"
    state_class: measurement
    unit_of_measurement: "Hz"
    accuracy_decimals: 0
    update_interval: 10s
    lambda: "return id(nasa).read_value(0x8239);"

binary_sensor:
  - platform: template
    name: "Pompa wody"
    device_class: running
    lambda: |-
      float v = id(nasa).read_value(0x4089);
      if (isnan(v)) return {};
      return v > 0.5;
  - platform: template
    name: "Praca pod nocnym limitem (0x80B1)"
    lambda: |-
      float v = id(nasa).read_value(0x80B1);
      if (isnan(v)) return {};
      return v > 0.5;
  # Base / drain-pan heater of the outdoor unit (ENUM_OUT_LOAD_BASEHEATER 0x80AF) - read-only status: the ODU
  # decides when to energize it (cold weather / defrost). There is no installer FSV for it.
  - platform: template
    name: "Grzałka bazy ODU (0x80AF)"
    device_class: running
    lambda: |-
      float v = id(nasa).read_value(0x80AF);
      if (isnan(v)) return {};
      return v > 0.5;

text_sensor:
  - platform: template
    name: "Tryb pracy"
    icon: mdi:heat-pump
    update_interval: 10s
    lambda: |-
      float v = id(nasa).read_value(0x4001);
      if (isnan(v)) return std::string("—");
      switch ((int) v) {
        case 0: return std::string("Auto");
        case 1: return std::string("Chłodzenie");
        case 2: return std::string("Osuszanie");
        case 3: return std::string("Wentylacja");
        case 4: return std::string("Grzanie");
        default: { char b[24]; snprintf(b, sizeof(b), "tryb %d", (int) v); return std::string(b); }
      }
