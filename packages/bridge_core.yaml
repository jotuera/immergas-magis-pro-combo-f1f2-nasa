# Immergas Magis Pro / Combo F1/F2 (Samsung NASA) - package "bridge_core"
# Base: project info, RS485 UART (MIM side), the nasa_bridge hub (component fetched from GitHub) and the
# read-only readback sensors. Required. Part of jotuera/immergas-magis-pro-combo-f1f2-nasa-bridge (MIT).
# Loaded by the main YAML through `packages:`.
#
# File, id and substitution names start with bridge_ (and the component is nasa_bridge), so this repo does
# NOT collide with the read-only f1f2-nasa reader (f1f2_), nor dd-modbus (dd_) / tt-bms (tt_).
#
# SAFETY: this package only TAPS the bus and reads. Writing lives in the OPTIONAL packages/bridge_control.yaml,
# which is commented out in the main YAML. With bridge_control absent, nothing is ever transmitted to the
# heat pump (bridge_allow_write stays "false" and there is no "Arm write" switch). See README "Read this first".

substitutions:
  bridge_project_version: "1.1.31"
  # RS485 pins - MIM / F1-F2 side (M5Stack Atom + Atomic RS485 Base). Override in your main YAML if wiring differs.
  bridge_uart_tx_pin: GPIO19
  bridge_uart_rx_pin: GPIO22
  bridge_de_pin: GPIO25            # DE/TX-enable of the Atomic RS485 Base (the MIM tap transceiver)
  # Master write gate and bus role. Keep both at their safe defaults unless you know what you are doing.
  bridge_allow_write: "false"      # "false" = the component never transmits a WRITE, even if armed from HA
  bridge_relay_enabled: "false"    # "false" = parallel TAP (recommended). "true" = legacy in-line relay (breaks A101)
  bridge_auto_poll: "true"         # "true" = continuously read the FSV catalog in the background (keeps values fresh)
  bridge_inject_gap: 40ms          # transmit only after this much bus silence
  bridge_diag_interval: 5s         # period of the DIAG log line (byte/frame counters)

# NOTE: no esphome.project block here. This repo's f1f2_core already sets esphome.project, and two
# project blocks on one device clash. For a control-ONLY device (bridge packages without f1f2_core),
# add your own esphome.project if you want one.

# The nasa_bridge component (Samsung NASA tap + inject), downloaded from GitHub (this repo).
# @v2.2.1 = this release; @main = latest development version.
external_components:
  - source: github://jotuera/immergas-magis-pro-combo-f1f2-nasa@v2.2.1
    components: [nasa_bridge]
    refresh: 1d

# Magis indoor box: F1/F2 (terminals of the MIM-B19N board) -> RS485 A/B. 9600 8E1. MIM rotary switch must be 1.
uart:
  - id: bridge_uart
    tx_pin: ${bridge_uart_tx_pin}
    rx_pin: ${bridge_uart_rx_pin}
    baud_rate: 9600
    parity: EVEN
    stop_bits: 1
    rx_buffer_size: 1024

# Parallel TAP + inject. The component listens on the bus and (only when armed AND a control entity sends a
# write) injects a single whitelisted NASA frame in a silence window. Readback sensors below are pure reads.
nasa_bridge:
  id: nasa
  mim_uart: bridge_uart
  mim_de_pin: ${bridge_de_pin}
  source_address: [0x80, 0xFF, 0x00]   # our own NASA address (writes -> 20.00.01, reads -> B2.00.20, in code)
  relay_enabled: ${bridge_relay_enabled}
  auto_poll: ${bridge_auto_poll}
  allow_write: ${bridge_allow_write}
  inject_gap: ${bridge_inject_gap}
  diag_interval: ${bridge_diag_interval}
  # Live-telemetry sensors (0x8239 Hz limit, 0x4247 setpoint, 0x4238 flow, 0x8238 compressor freq,
  # 0x42F1 FR ratio) are intentionally NOT exposed here - they are already provided by the read-only
  # f1f2-nasa integration. The component still parses those codes internally (for the FR-control
  # experiment and the DIAG log); it just does not create duplicate HA entities.
