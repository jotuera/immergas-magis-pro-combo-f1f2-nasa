# Immergas Magis Pro / Combo F1/F2 (Samsung NASA) - package "f1f2_fsv"
# All 94 FSV installer settings of the Samsung side (read-only; read 30 s after boot, then every
# f1f2_poll_interval; button 'Read FSV now'). Needs f1f2_transmit: true.
# Part of jotuera/immergas-magis-pro-combo-f1f2-nasa (MIT). Loaded by the main YAML through `packages:`.
# File, id and substitution names start with f1f2_ so this repo can be combined with the D+/D- and T-/T+
# repos on one device.

