# Immergas Magis Pro / Combo F1/F2 (Samsung NASA) - package "bridge_control"  -- OPTIONAL, WRITES TO THE PUMP
# ============================================================================================================
#  DO NOT add this package unless you have read README "Read this first" and accept the risk.
#
#  Adding it creates the controls that let the bridge INJECT NASA write frames to the heat pump. Even then:
#   * nothing is transmitted until you turn ON the "Arm write" switch (bridge_allow_write gate), AND
#   * only the whitelisted messages can ever be written (FR control 0x40A7/0x42F1 and the one configured FSV);
#     the compressor / EEV / protection / flow registers are NOT on the whitelist and can never be written.
#
#  On a Magis the Immergas controller owns the loop: in testing every functional write was either overwritten
#  (water-out max FSV 1031) or rejected by the unit (FR ratio 0x42F1 stays 0xFFFF), with no effect on the
#  compressor. This package is kept as a research tool, not a working control solution. See FINDINGS.md.
# ============================================================================================================

switch:
  # ARM: the master write gate. Nothing is transmitted to the pump until this is ON. (Reads are benign.)
  - platform: template
    name: ${n_bridge_arm}
    icon: mdi:lock-open-alert
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - lambda: "id(nasa).set_allow_write(true);"
    turn_off_action:
      - lambda: "id(nasa).set_allow_write(false);"

  # Outing/away mode activation (ENUM_IN_OUTING_MODE 0x406D). The FSV 5011-5019 only set its target
  # temperatures; this switch flips the mode on/off. Needs "Arm write" ON. State is read from the bus, so a
  # revert shows up; on a Magis it may be overridden by the Immergas controller (unproven).
  - platform: template
    name: ${n_bridge_outing}
    icon: mdi:bag-suitcase
    lambda: |-
      float v = id(nasa).read_value(0x406D);
      if (isnan(v)) return {};
      return v > 0.5;
    turn_on_action:
      - lambda: "id(nasa).outing_set(true);"
    turn_off_action:
      - lambda: "id(nasa).outing_set(false);"

  # FR control enable (FSV 5051 / NASA 0x40A7). CONFIRMED WORKING on a Magis - the second lever that actually
  # does something: enabling it caps the compressor frequency (built-in default ~50% ratio). Verified by A/B
  # under load (compressor 35 Hz -> 30 Hz when on, back to 35 Hz when off, with a delayed ramp-back). A real
  # eco / quiet control (limits compressor power and noise) - it only bites while the compressor runs above
  # ~32 Hz; on a mild day at minimum modulation there is nothing to cut. The custom ratio value (0x42F1) stays
  # rejected, so you get the fixed ~50% default. Needs "Arm write" ON. Lives in Controls (moved from the FSV
  # catalog). State is read from the bus, so a revert shows up.
  - platform: template
    name: ${n_bridge_fr_enable}
    icon: mdi:speedometer-slow
    lambda: |-
      float v = id(nasa).read_value(0x40A7);
      if (isnan(v)) return {};
      return v > 0.5;
    turn_on_action:
      - lambda: "id(nasa).fr_set_enable(true);"
    turn_off_action:
      - lambda: "id(nasa).fr_set_enable(false);"

  # === CONFIRMED NOT WORKING ON A MAGIS (tested 2026-10-28) - commented out, kept for reference ===
  # Samsung-native quiet mode (ENUM_IN_SILENCE 0x4046): the write is REJECTED - the switch flips back to off
  # within ~1 s (the bus reverts 0x4046 to 0), tested with the compressor actually running (19-23 Hz). Quiet
  # mode is driven by Immergas (U11 via D+/D- -> 0x428D -> Hz limit 0x8239 64->19), not a direct 0x4046 write.
  # The firmware keeps silence_set() + the whitelist, so this entity can be re-enabled for testing elsewhere.
  # - platform: template
  #   name: ${n_bridge_silence}
  #   icon: mdi:volume-mute
  #   lambda: |-
  #     float v = id(nasa).read_value(0x4046);
  #     if (isnan(v)) return {};
  #     return v > 0.5;
  #   turn_on_action:
  #     - lambda: "id(nasa).silence_set(true);"
  #   turn_off_action:
  #     - lambda: "id(nasa).silence_set(false);"

