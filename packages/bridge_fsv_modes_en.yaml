# Immergas Magis Pro / Combo F1/F2 bridge - package bridge_fsv_modes (en). Generated - do not edit by hand.
# FSV subsystem: Special modes (outing, derating, PV, Smart Grid) (code 5xxx). Editable installer settings (Configuration).
# On/off -> switch; multi-value -> select (labels from the Samsung EHS manual); temps/durations ->
# number. Values read from the bus (lambda); writes gated by 'Arm write'. On a Magis many FSV writes
# are overwritten - see FINDINGS. Load alongside the other bridge_fsv_* subsystem packages as needed.
