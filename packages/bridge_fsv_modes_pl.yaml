number:
  - platform: template
    name: "FSV 5011 - Tryb wyjazdowy - woda wyj. chłodzenie"
    entity_category: config
    mode: slider
    lambda: "return id(nasa).fsv_value(0x4273);"
    update_interval: 2s
    min_value: 5
    max_value: 25
    step: 1
    unit_of_measurement: "°C"
    set_action:
      - lambda: "id(nasa).fsv_write(0x4273, x);"
