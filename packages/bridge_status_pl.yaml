# Immergas Magis Pro / Combo F1/F2 (Samsung NASA) bridge - pakiet "bridge_status" (polski)
# Żywy odczyt aktywnego kodu błędu Samsung EHS z magistrali, z opisem z instrukcji (ERROR_CODES.pl.md).
# Tylko ODCZYT - nic nie zapisuje, nie wymaga uzbrojenia. Wybierz JEDEN: bridge_status_pl | bridge_status_en.
#
# Źródło kodu: 0x0202 VAR_AD_ERROR_CODE1 (Hydro/wnętrzna - kody E9xx/E6xx z pilota przewodowego) oraz
# 0x8235 VAR_OUT_ERROR_CODE (jednostka zewnętrzna). Surowa wartość = numer po "E"; 0 = brak błędu. Oba kody
# są odpytywane w tle (extra_poll_ w komponencie), więc działają gdy "Emuluj panel" (auto-poll) jest ON.

text_sensor:
  - platform: template
    name: ${n_bridge_error_code}
    icon: mdi:alert-circle
    update_interval: 10s
    lambda: |-
      float h = id(nasa).read_value(0x0202);  // Hydro / wnętrzna
      float o = id(nasa).read_value(0x8235);  // ODU
      if (isnan(h) && isnan(o)) return std::string("—");
      int code = 0; const char *src = "";
      if (!isnan(h) && h > 0) { code = (int) h; }
      else if (!isnan(o) && o > 0) { code = (int) o; src = " (ODU)"; }
      if (code == 0) return std::string("OK — brak błędu");
      const char *d;
      switch (code) {
        case 122: d = "zwarcie/przerwa czujnika wlotu EVA"; break;
        case 123: d = "zwarcie/przerwa czujnika wylotu EVA"; break;
        case 601: d = "błąd komunikacji pilot — jednostka Hydro"; break;
        case 604: d = "błąd monitorowania pilot — jednostka Hydro"; break;
        case 653: d = "zwarcie/przerwa czujnika temp. pilota"; break;
        case 654: d = "błąd danych pilota (pamięć EEPROM)"; break;
        case 901: d = "zwarcie/przerwa czujnika wlotu wody"; break;
        case 902: d = "zwarcie/przerwa czujnika wylotu wymiennika płytowego"; break;
        case 903: d = "zwarcie/przerwa czujnika wylotu wody (grzałka zapasowa)"; break;
        case 904: d = "zwarcie/przerwa czujnika zbiornika CWU"; break;
        case 911: d = "przełącznik przepływu OFF — za niski przepływ wody"; break;
        case 912: d = "przełącznik przepływu ON przy wyłączonej pompie"; break;
        case 916: d = "zwarcie/przerwa czujnika zaworu mieszania (FSV 4041=1)"; break;
        default:  d = "nieznany kod — zob. ERROR_CODES.pl.md"; break;
      }
      char buf[96];
      snprintf(buf, sizeof(buf), "E%d%s — %s", code, src, d);
      return std::string(buf);
