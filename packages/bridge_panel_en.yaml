# Immergas Magis Pro / Combo F1/F2 (Samsung NASA) bridge - package "bridge_panel" (English)
# Live view of the key readouts the Samsung MWR-WW10N wired panel shows: water / DHW-tank / EVA / discharge
# temperatures, outdoor temp, compressor, pump, operating mode. READ-ONLY (no arming).
# Pick ONE: bridge_panel_pl | bridge_panel_en. OPT-IN: if the read-only immergas-magis-pro-combo-f1f2-nasa
# reader runs on the same device, some of these values exist there already (avoid duplicates - enable one).
#
# Scaling: read_value() returns the raw value (unsigned/unscaled); temperatures are int16 x0.1 degC, 0xFFFF and
# 0xFE0C = no sensor -> NaN. Panel codes are polled faster than the catalog (alternated in the component), so
# they refresh every ~dozen seconds while "Emulate panel" (auto-poll) is ON.

sensor:
  - platform: template
    name: "Outdoor temperature (ODU)"
    device_class: temperature
    state_class: measurement
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    update_interval: 10s
    lambda: |-
      float r = id(nasa).read_value(0x8204);
      if (isnan(r)) return NAN;
      uint16_t u = (uint16_t) r; if (u == 0xFE0C) return NAN;
      return (int16_t) u / 10.0f;
  - platform: template
    name: "Water temp - return"
