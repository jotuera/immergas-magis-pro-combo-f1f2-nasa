binary_sensor:
  - platform: template
    name: "Water pump"
    device_class: running
    lambda: |-
      float v = id(nasa).read_value(0x4089);
      if (isnan(v)) return {};
      return v > 0.5;
  - platform: template
    name: "Running under night limit (0x80B1)"
    lambda: |-
      float v = id(nasa).read_value(0x80B1);
      if (isnan(v)) return {};
      return v > 0.5;
  # Base / drain-pan heater of the outdoor unit (ENUM_OUT_LOAD_BASEHEATER 0x80AF) - read-only status: the ODU
  # decides when to energize it (cold weather / defrost). There is no installer FSV for it.
  - platform: template
    name: "ODU base heater (0x80AF)"
    device_class: running
    lambda: |-
      float v = id(nasa).read_value(0x80AF);
      if (isnan(v)) return {};
      return v > 0.5;

text_sensor:
  - platform: template
    name: "Operating mode"
    icon: mdi:heat-pump
    update_interval: 10s
    lambda: |-
      float v = id(nasa).read_value(0x4001);
      if (isnan(v)) return std::string("—");
      switch ((int) v) {
        case 0: return std::string("Auto");
        case 1: return std::string("Cooling");
        case 2: return std::string("Dry");
        case 3: return std::string("Fan");
        case 4: return std::string("Heating");
        default: { char b[24]; snprintf(b, sizeof(b), "mode %d", (int) v); return std::string(b); }
      }
