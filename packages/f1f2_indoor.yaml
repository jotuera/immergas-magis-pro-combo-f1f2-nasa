# Immergas Magis Pro / Combo F1/F2 (Samsung NASA) - package "f1f2_indoor"
# Indoor unit (MIM board, 20.00.01): water temperatures, active water target, DHW, zone 1, pump, heaters, modes.
# Part of jotuera/immergas-magis-pro-combo-f1f2-nasa (MIT). Loaded by the main YAML through `packages:`.
# File, id and substitution names start with f1f2_ so this repo can be combined with the D+/D- and T-/T+
# repos on one device.

sensor:
  - {platform: f1f2_nasa, key: flow_temp_out, id: f1f2_flow_temp_out}
  - {platform: f1f2_nasa, key: flow_temp_return, id: f1f2_flow_temp_return}
  - {platform: f1f2_nasa, key: water_outlet_target}
  - {platform: f1f2_nasa, key: dhw_temperature}
  - {platform: f1f2_nasa, key: dhw_target}
  - {platform: f1f2_nasa, key: zone1_room_temp}
  - {platform: f1f2_nasa, key: zone1_target}
  - {platform: f1f2_nasa, key: eva_in_temp}
  - {platform: f1f2_nasa, key: water_out_tw2}
  - {platform: f1f2_nasa, key: outdoor_temp_copy}
  - {platform: f1f2_nasa, key: heater_out_temp}
  - {platform: f1f2_nasa, key: mixing_valve_temp}
  - {platform: f1f2_nasa, key: capacity_request}
  - {platform: f1f2_nasa, key: capacity_absolute}
  - {platform: f1f2_nasa, key: indoor_eev}
  - {platform: f1f2_nasa, key: two_way_valve}
  - {platform: f1f2_nasa, key: three_way_valve}
  - {platform: f1f2_nasa, key: operation_mode}
  - {platform: f1f2_nasa, key: control_reference}
  - {platform: f1f2_nasa, key: status_bits_440e}

binary_sensor:
  - {platform: f1f2_nasa, key: water_pump}
  - {platform: f1f2_nasa, key: backup_heater}
  - {platform: f1f2_nasa, key: booster_heater}
  - {platform: f1f2_nasa, key: defrost}
  - {platform: f1f2_nasa, key: dhw_power}
  - {platform: f1f2_nasa, key: zone1_power}
  - {platform: f1f2_nasa, key: zone2_power}
  - {platform: f1f2_nasa, key: pv_control}
  - {platform: f1f2_nasa, key: smart_grid}

text_sensor:
  - {platform: f1f2_nasa, key: dhw_mode}
  - {platform: f1f2_nasa, key: operation_mode_text}
  - {platform: f1f2_nasa, key: three_way_valve_text}
