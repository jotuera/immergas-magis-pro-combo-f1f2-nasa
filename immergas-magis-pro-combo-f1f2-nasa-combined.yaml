# Immergas Magis Pro / Combo - F1/F2 Samsung NASA - COMBINED reader + control on ONE device.
#
# The read-only reader (f1f2_nasa) and the tap+inject control path (nasa_bridge) are on the SAME F1/F2 bus,
# so they share ONE uart (unlike the dd-/tt- family buses). Only the bridge ever transmits; the reader
# listens (f1f2_transmit implied false - it has no transmit here) and sees the answers to the bridge's polls.
#
# This file declares the device, one uart and BOTH hubs inline, then pulls only the ENTITY packages from
# GitHub (NOT f1f2_core / bridge_core - those would each define their own uart and clash). For a reader-only
# or a control-only device use the normal main YAML with f1f2_core or bridge_core instead.
#
# SAFETY: writing is OFF until you turn on the "Arm write" switch (allow_write). Only whitelisted messages
# (outing / FR / silence / writable FSV) can ever be written; compressor / EEV / protection / flow never.
# Read README "Control" and FINDINGS.md first.

substitutions:
  device_name: immergas-f1f2-combined
  friendly_name: Immergas F1 F2

  # --- one shared RS485 (F1/F2 / MIM side). Match your wiring. ---
  uart_tx_pin: GPIO19
  uart_rx_pin: GPIO22
  bridge_de_pin: GPIO25            # DE/TX-enable of the transceiver (the bridge drives it when injecting)

  # --- reader (f1f2_nasa) ---
  f1f2_indoor_address: "20.00.01"
  f1f2_outdoor_address: "10.00.00"

  # --- control (nasa_bridge) ---
  bridge_allow_write: "false"      # master gate: never transmits a WRITE until armed from HA
  bridge_relay_enabled: "false"    # parallel TAP (recommended)
  bridge_auto_poll: "true"         # the bridge polls the FSV catalog; keep polling on EXACTLY one side
  bridge_inject_gap: 40ms
  bridge_diag_interval: 5s

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2026.9.0
  project:
    name: "jotuera.immergas-magis-pro-combo-f1f2-nasa"
    version: "2.0.0"

esp32:
  board: m5stack-atom
  framework:
    type: esp-idf

logger:
  level: INFO
  baud_rate: 0                     # free the hardware UART for the bus

api:
  encryption:
    key: !secret api_key
ota:
  - platform: esphome
    password: !secret ota_password
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap: {}
captive_portal:

# Both components are vendored in this repo; pull them at the release tag.
external_components:
  - source: github://jotuera/immergas-magis-pro-combo-f1f2-nasa@v2.0.0
    components: [f1f2_nasa, nasa_bridge]
    refresh: 1d

# ONE uart, shared by both hubs. 9600 8E1. MIM rotary switch must be 1.
uart:
  - id: f1f2_uart
    tx_pin: ${uart_tx_pin}
    rx_pin: ${uart_rx_pin}
    baud_rate: 9600
    parity: EVEN
    stop_bits: 1
    rx_buffer_size: 1024

# Reader: listens only (no transmit param = pure listener here), rich decoded entities.
f1f2_nasa:
  id: f1f2_hub
  uart_id: f1f2_uart
  language: ${f1f2_language}
  transmit: "false"                # reader does not transmit; the bridge polls instead
  indoor_address: ${f1f2_indoor_address}
  outdoor_address: ${f1f2_outdoor_address}

# Control: same uart, owns the DE pin for its injects.
nasa_bridge:
  id: nasa
  mim_uart: f1f2_uart
  mim_de_pin: ${bridge_de_pin}
  source_address: [0x80, 0xFF, 0x00]
  relay_enabled: ${bridge_relay_enabled}
  auto_poll: ${bridge_auto_poll}
  allow_write: ${bridge_allow_write}
  inject_gap: ${bridge_inject_gap}
  diag_interval: ${bridge_diag_interval}

packages:
  reader:
    url: https://github.com/jotuera/immergas-magis-pro-combo-f1f2-nasa
    ref: v2.0.0
    refresh: 1d
    files:
      # reader entities only (NOT f1f2_core - uart/hub declared above)
      - packages/f1f2_indoor.yaml
      - packages/f1f2_outdoor.yaml
      - packages/f1f2_info.yaml
      - packages/f1f2_fsv.yaml
      - packages/f1f2_computed.yaml
      - packages/f1f2_diagnostics.yaml
      - packages/lang/f1f2_pl.yaml          # reader language (pick en or pl)
      # control entities (NOT bridge_core - hub declared above)
      - packages/bridge_control.yaml        # WRITES (outing + FR + Arm). Remove for read-only.
      - packages/bridge_status_pl.yaml      # error code (read-only)
      - packages/lang/bridge_pl.yaml        # control language (pick en or pl)
