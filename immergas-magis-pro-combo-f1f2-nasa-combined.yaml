# Immergas Magis Pro / Combo - F1/F2 Samsung NASA - reader + control on ONE device, ONE component.
#
# IMPORTANT: use a SINGLE NASA component. In ESPHome a UART read is destructive, so two components reading
# the same bus steal each other's bytes (no frames decode, and the device can boot-loop). Therefore control
# is native in `f1f2_nasa` (package f1f2_control), not a second component. Reader + control, one hub, one UART.
#
# This file uses f1f2_core (UART + the f1f2_nasa hub + the component download), the reader entity packages,
# and f1f2_control (the write levers). f1f2_transmit must be "true" so the hub can poll and write.
#
# SAFETY: writing is OFF until you turn on the "Arm write" switch (allow_write). Only whitelisted messages
# (outing 0x406D, FR enable 0x40A7) can ever be written; compressor / EEV / protection / flow / setpoint are
# refused in the hub. Read README "Control" and FINDINGS.md first.

substitutions:
  device_name: immergas-f1f2
  friendly_name: Immergas F1 F2
  # RS485 pins. Default: M5Stack Atom + Atomic RS485 Base (GPIO19/22, has a DE pin - set f1f2 flow_control_pin
  # under f1f2_nasa if your board needs it). For an AtomS3 Lite + isolated RS485 Unit on the Grove port set
  # board m5stack-atoms3 below and f1f2_uart_rx_pin: GPIO1 / f1f2_uart_tx_pin: GPIO2 (auto-direction, no DE).
  f1f2_uart_tx_pin: GPIO19
  f1f2_uart_rx_pin: GPIO22
  f1f2_transmit: "true"            # required: the hub polls and writes

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2026.9.0

esp32:
  board: m5stack-atom              # AtomS3 Lite: m5stack-atoms3
  framework:
    type: esp-idf

logger:
  level: INFO

api:
  encryption:
    key: !secret api_key
ota:
  - platform: esphome
    password: !secret ota_password
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap: {}
captive_portal:

web_server:
  port: 80
  version: 3
  local: true

packages:
  f1f2_nasa:
    url: https://github.com/jotuera/immergas-magis-pro-combo-f1f2-nasa
    ref: v2.2.0
    refresh: 1d
    files:
      - packages/f1f2_core.yaml          # UART + the f1f2_nasa hub (ONE component) + component download
      - packages/f1f2_indoor.yaml
      - packages/f1f2_outdoor.yaml
      - packages/f1f2_info.yaml
      # - packages/f1f2_fsv.yaml         # all 94 installer FSV as read-only sensors - commented out (clutter).
      #                                    The rest are documented in FSV_MAP.md. Uncomment for the full set.
      - packages/f1f2_computed.yaml
      - packages/f1f2_diagnostics.yaml
      - packages/f1f2_control.yaml        # WRITE levers: Arm + Outing (0x406D) + FR (0x40A7). Remove for read-only.
      - packages/f1f2_outing_targets.yaml # Outing targets FSV 5011-5019 as editable sliders. Remove for read-only.
      - packages/lang/f1f2_pl.yaml        # language (pick en or pl)
