  comp_top_temp:          {pdu: 0x8280, src: outdoor, dec: temp, unit: "°C", dc: temperature, sc: measurement, acc: 1}
  cond_out_temp:          {pdu: 0x8218, src: outdoor, dec: temp, unit: "°C", dc: temperature, sc: measurement, acc: 1}
