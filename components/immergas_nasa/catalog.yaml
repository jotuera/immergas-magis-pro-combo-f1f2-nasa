  power_consumed:         {pdu: 0x8413, src: outdoor, dec: raw, nan: [0xFFFFFFFF], unit: "W", dc: power, sc: measurement, acc: 0}
  outdoor_power:          {pdu: 0x8411, src: outdoor, dec: raw, nan: [0xFFFFFFFF], unit: "W", dc: power, sc: measurement, acc: 0}
  energy_consumed_total:  {pdu: 0x8414, src: outdoor, dec: raw, mul: 0.001, nan: [0xFFFFFFFF], unit: "kWh", dc: energy, sc: total_increasing, acc: 3}
  outdoor_current:        {pdu: 0x8217, src: outdoor, dec: raw, mul: 0.1, unit: "A", dc: current, sc: measurement, acc: 1}
  heat_pump_voltage:      {pdu: 0x24FC, src: outdoor, dec: raw, nan: [0xFFFFFFFF], unit: "V", dc: voltage, sc: measurement, acc: 0}
  mains_voltage:          {pdu: 0x82ED, src: outdoor, dec: raw, unit: "V", dc: voltage, sc: measurement, acc: 0}
  dc_link_voltage:        {pdu: 0x823B, src: outdoor, dec: raw, mul: 2, unit: "V", dc: voltage, sc: measurement, acc: 0}
  unit_capacity:          {pdu: 0x82E3, src: outdoor, dec: raw, mul: 0.1, unit: "kW", acc: 1, icon: "mdi:information-outline"}
  discharge_temp:         {pdu: 0x820A, src: outdoor, dec: temp, unit: "°C", dc: temperature, sc: measurement, acc: 1}
