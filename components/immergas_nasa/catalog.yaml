  raw_8239:               {pdu: 0x8239, src: outdoor, dec: raw, acc: 0, cat: diagnostic, status: candidate}
  raw_823f:               {pdu: 0x823F, src: outdoor, dec: raw, acc: 0, cat: diagnostic, status: unknown}
  raw_8243:               {pdu: 0x8243, src: outdoor, dec: raw, acc: 0, cat: diagnostic, status: unknown}
  raw_824b:               {pdu: 0x824B, src: outdoor, dec: raw, acc: 0, cat: diagnostic, status: unknown}
  raw_824c:               {pdu: 0x824C, src: outdoor, dec: raw, acc: 0, cat: diagnostic, status: unknown}
  raw_82e1:               {pdu: 0x82E1, src: outdoor, dec: raw, acc: 0, cat: diagnostic, status: unknown}
