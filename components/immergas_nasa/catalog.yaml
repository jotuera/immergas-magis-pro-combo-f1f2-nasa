# Entity catalog for the immergas_nasa component.
# Each key can be used as `key:` on the sensor / binary_sensor / text_sensor platforms; the name comes
# from translations/<language>.yaml, everything else (message id, source, decoding, unit...) from here.
#
# Fields:
#   pdu      NASA message id
#   src      indoor | outdoor   (address of the unit that broadcasts the value)
#   dec      temp  = signed int16 x0.1, 65535/65036 -> unknown   (default for temperatures)
#            raw   = value as received
#   mul      extra multiplier (applied after sign handling)
#   signed   treat as signed (int8/int16/int32 by message size)
#   hi       use the high 16 bits of a 4-byte value
#   nan      raw values that mean "not available" (in addition to the dec preset)
#   unit / dc (device_class) / sc (state_class) / acc (accuracy_decimals) / icon / cat (entity_category)
#   poll     true = value is not broadcast, read it with READ requests (needs transmit: true)
#   status   observed | candidate | unknown   (documentation only)

sensors:
  # ---------------------------------------------------------------- indoor unit (hydro / MIM), 20.00.01
  flow_temp_out:          {pdu: 0x4238, src: indoor, dec: temp, unit: "°C", dc: temperature, sc: measurement, acc: 1}
  flow_temp_return:       {pdu: 0x4236, src: indoor, dec: temp, unit: "°C", dc: temperature, sc: measurement, acc: 1}
  water_outlet_target:    {pdu: 0x4247, src: indoor, dec: temp, nan: [50], unit: "°C", dc: temperature, sc: measurement, acc: 1}
  dhw_temperature:        {pdu: 0x4237, src: indoor, dec: temp, unit: "°C", dc: temperature, sc: measurement, acc: 1}
  dhw_target:             {pdu: 0x4235, src: indoor, dec: temp, unit: "°C", dc: temperature, sc: measurement, acc: 1}
  zone1_room_temp:        {pdu: 0x4203, src: indoor, dec: temp, unit: "°C", dc: temperature, sc: measurement, acc: 1}
  zone1_target:           {pdu: 0x4201, src: indoor, dec: temp, unit: "°C", dc: temperature, sc: measurement, acc: 1}
  zone2_room_temp:        {pdu: 0x42D4, src: indoor, dec: temp, unit: "°C", dc: temperature, sc: measurement, acc: 1}
  zone2_target:           {pdu: 0x42D6, src: indoor, dec: temp, unit: "°C", dc: temperature, sc: measurement, acc: 1}
  eva_in_temp:            {pdu: 0x4205, src: indoor, dec: temp, unit: "°C", dc: temperature, sc: measurement, acc: 1}
  water_out_tw2:          {pdu: 0x4204, src: indoor, dec: temp, unit: "°C", dc: temperature, sc: measurement, acc: 1}
  outdoor_temp_copy:      {pdu: 0x420C, src: indoor, dec: temp, unit: "°C", dc: temperature, sc: measurement, acc: 1}
  heater_out_temp:        {pdu: 0x4239, src: indoor, dec: temp, unit: "°C", dc: temperature, sc: measurement, acc: 1}
  mixing_valve_temp:      {pdu: 0x428C, src: indoor, dec: temp, unit: "°C", dc: temperature, sc: measurement, acc: 1}
  flow_rate:              {pdu: 0x42E9, src: indoor, dec: raw, mul: 0.1, unit: "L/min", dc: volume_flow_rate, sc: measurement, acc: 1}
  capacity_request:       {pdu: 0x4211, src: indoor, dec: raw, mul: 0.11627907, unit: "kW", dc: power, sc: measurement, acc: 2}
  capacity_absolute:      {pdu: 0x4212, src: indoor, dec: raw, mul: 0.11627907, unit: "kW", dc: power, sc: measurement, acc: 2}
  power_produced:         {pdu: 0x4426, src: indoor, dec: raw, signed: true, nan: [0xFFFFFFFF], unit: "W", dc: power, sc: measurement, acc: 0}
  energy_produced_total:  {pdu: 0x4427, src: indoor, dec: raw, mul: 0.001, nan: [0xFFFFFFFF], unit: "kWh", dc: energy, sc: total_increasing, acc: 3}
  indoor_eev:             {pdu: 0x4217, src: indoor, dec: raw, acc: 0}
  two_way_valve:          {pdu: 0x408A, src: indoor, dec: raw, acc: 0}
  three_way_valve:        {pdu: 0x4067, src: indoor, dec: raw, acc: 0}
  operation_mode:         {pdu: 0x4001, src: indoor, dec: raw, acc: 0}
  control_reference:      {pdu: 0x406F, src: indoor, dec: raw, acc: 0}
  status_bits_440e:       {pdu: 0x440E, src: indoor, dec: raw, acc: 0, status: candidate}
  # unknown / raw (diagnostic) - help welcome, see PDU_MAP.md
  raw_0402:               {pdu: 0x0402, src: indoor, dec: raw, acc: 0, cat: diagnostic, status: unknown}
  raw_0411:               {pdu: 0x0411, src: indoor, dec: raw, acc: 0, cat: diagnostic, status: unknown}
  raw_0412:               {pdu: 0x0412, src: indoor, dec: raw, acc: 0, cat: diagnostic, status: unknown}
  raw_0413:               {pdu: 0x0413, src: indoor, dec: raw, acc: 0, cat: diagnostic, status: unknown}
  raw_0414:               {pdu: 0x0414, src: indoor, dec: raw, acc: 0, cat: diagnostic, status: unknown}
  raw_0415:               {pdu: 0x0415, src: indoor, dec: raw, acc: 0, cat: diagnostic, status: unknown}
  raw_4006:               {pdu: 0x4006, src: indoor, dec: raw, acc: 0, cat: diagnostic, status: unknown}
  raw_440a:               {pdu: 0x440A, src: indoor, dec: raw, acc: 0, cat: diagnostic, status: unknown}

  # ---------------------------------------------------------------- outdoor unit, 10.00.00
  outdoor_temperature:    {pdu: 0x8204, src: outdoor, dec: temp, unit: "°C", dc: temperature, sc: measurement, acc: 1}
