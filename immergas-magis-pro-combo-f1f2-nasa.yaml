# Immergas Magis Pro / Combo - Samsung NASA bus (F1/F2) reader for ESPHome (M5Stack Atom + RS485)
#
# Reads the heat-pump data the outdoor unit (Samsung EHS, e.g. Audax Pro V2) and the indoor interface board
# (Samsung MIM-B19N inside the Magis) exchange on the F1/F2 bus: temperatures, compressor, fan, EEV, power,
# energy, defrost, errors, firmware and all FSV installer settings. Uses its own component `immergas_nasa`
# (no third-party NASA component needed). Entity names come from components/immergas_nasa/translations/.
#
# Project : jotuera.immergas-magis-pro-combo-f1f2-nasa  |  v0.9.0 (beta)
# Repo    : https://github.com/jotuera/immergas-magis-pro-combo-f1f2-nasa
# License : MIT (c) 2026 JoTu
# Tested  : Magis Combo 9 Plus V2 + Audax Pro 9 V2 outdoor unit, MIM-B19N rotary switch = 1.
#
# IMPORTANT: on F1/F2 only READ is safe and useful - writes are ignored by the Immergas controller.
# This config never writes. With transmit: true it only sends READ requests for the FSV values.

substitutions:
  device_name: immergas-f1f2-atom      # hostname, max 31 characters
  friendly_name: Immergas F1-F2 Atom
  # Entity language: en | pl   (one line - see TRANSLATING.md to add yours)
  language: en

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2026.5.0
  project:
    name: jotuera.immergas-magis-pro-combo-f1f2-nasa
    version: 0.9.0

esp32:
  board: m5stack-atom
  framework:
    type: esp-idf

external_components:
  - source: github://jotuera/immergas-magis-pro-combo-f1f2-nasa@main
    components: [immergas_nasa]
    refresh: 1d

logger:
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap: {}

captive_portal:

web_server:
  port: 80
  version: 3

time:
  - platform: homeassistant
    id: ha_time

# M5Stack Atom + Atomic RS485 Base: A/B -> F1/F2. 9600 8E1.
uart:
  id: nasa_uart
  tx_pin: GPIO19
  rx_pin: GPIO22
  baud_rate: 9600
  parity: EVEN
  stop_bits: 1
  rx_buffer_size: 1024

immergas_nasa:
  uart_id: nasa_uart
  language: ${language}
  transmit: true            # false = listen only (no FSV values)
  poll_interval: 30min      # how often FSV are re-read
  # flow_control_pin: GPIO23  # only for RS485 boards with a DE/RE pin

sensor:
  # ---------------- decoded (indoor unit 20.00.01 + outdoor unit 10.00.00)
