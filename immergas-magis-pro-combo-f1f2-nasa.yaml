  # ---------------- derived values
  - platform: template
    name: Flow Temp Delta
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 10s
    lambda: |-
      return id(flow_temp_out).state - id(flow_temp_return).state;
  - platform: template
    name: COP - Instant
    icon: mdi:chart-bar
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 10s
    lambda: |-
      float in = id(power_consumed).state, out = id(power_produced).state;
      if (std::isnan(in) || std::isnan(out) || in <= 0) return NAN;
      return std::min(8.0f, std::max(0.0f, out / in));
  - platform: template
    name: COP - Total
    icon: mdi:chart-bar
    accuracy_decimals: 2
    update_interval: 300s
    lambda: |-
      float in = id(energy_consumed_total).state, out = id(energy_produced_total).state;
      if (std::isnan(in) || std::isnan(out) || in <= 0) return NAN;
      return out / in;
  - platform: total_daily_energy
    name: Daily Energy Consumed
    power_id: power_consumed
    unit_of_measurement: kWh
    accuracy_decimals: 3
    filters:
      - multiply: 0.001

