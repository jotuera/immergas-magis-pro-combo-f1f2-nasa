# Immergas Magis Pro / Combo - Samsung NASA bus (F1/F2) reader for ESPHome (M5Stack Atom + RS485)
#
# Reads the heat-pump data the outdoor unit (Samsung EHS, e.g. Audax Pro V2) and the indoor interface board
# (Samsung MIM-B19N inside the Magis) exchange on the F1/F2 bus: temperatures, compressor (incl. the frequency
# limit of the night function), fan, EEV, power, energy, defrost, errors, firmware and all FSV installer settings.
# Uses its own component `f1f2_nasa` (no third-party NASA component needed). No cloud.
#
# Project : jotuera.immergas-magis-pro-combo-f1f2-nasa  |  v2.5.2
# Repo    : https://github.com/jotuera/immergas-magis-pro-combo-f1f2-nasa
# License : MIT (c) 2026 JoTu
# Tested  : Magis Combo 9 Plus V2 + Audax Pro 9 V2 outdoor unit, MIM-B19N rotary switch = 1.
#
# This file is all you copy into ESPHome. The code lives in packages/*.yaml and components/f1f2_nasa of the repo
# and is fetched from GitHub (packages: below). Remove a line to drop a feature; f1f2_core is always needed.
# Language: pick ONE file from packages/lang/ (f1f2_en, f1f2_pl).
#
# File, id and substitution names start with f1f2_, so this repo can run on the same device as the D+/D-
# (dd-modbus) and T-/T+ (tt-bms) projects: list their packages next to these ones and keep one device section.
#
# IMPORTANT: on F1/F2 only READ is safe and useful - writes are ignored by the Immergas controller.
# This config never writes. It only sends READ requests for the FSV values (f1f2_transmit: "false" = listen only).

substitutions:
  device_name: immergas-f1f2-atom          # hostname, max 31 characters
  friendly_name: Immergas F1-F2 Atom
  # RS485 pins - change only if your wiring differs from M5Stack Atom + Atomic RS485 Base:
  # f1f2_uart_tx_pin: GPIO19
  # f1f2_uart_rx_pin: GPIO22
  # Addresses of the units (defaults fit a Magis; the "NASA Devices" entity shows yours):
  # f1f2_indoor_address: "20.00.01"
  # f1f2_outdoor_address: "10.00.00"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: false
  min_version: 2026.9.0

esp32:
  board: m5stack-atom
  framework:
    type: esp-idf

logger:
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Uses DHCP by default. Uncomment and adjust for a static IP:
  # manual_ip:
  #   static_ip: 192.168.1.55
  #   gateway: 192.168.1.1
  #   subnet: 255.255.255.0
  ap: {}

captive_portal:

web_server:
  port: 80
  version: 3

# The F1/F2 code, downloaded from GitHub. Change "ref" to upgrade (or "main" for the development version).
packages:
  f1f2_nasa:
    url: https://github.com/jotuera/immergas-magis-pro-combo-f1f2-nasa
    ref: v2.5.2
    refresh: 1d
    files:
      - packages/f1f2_core.yaml          # UART, f1f2_nasa hub, device list                     (required)
      - packages/f1f2_indoor.yaml        # indoor unit: water temps, active target, DHW, zone 1, pump
      - packages/f1f2_outdoor.yaml       # outdoor unit: compressor, frequency limit, fan, EEV, power, errors
      - packages/f1f2_info.yaml          # firmware versions, capacity class
      - packages/f1f2_fsv.yaml           # all 94 FSV installer settings (read-only)
      - packages/f1f2_computed.yaml      # flow delta T, energy consumed today
      - packages/f1f2_diagnostics.yaml   # undecoded PDUs, bus statistics, sniffer
      # - packages/f1f2_ehs_extra.yaml   # zone 2, flow rate, produced energy, COP - NOT sent by a Magis
      - packages/lang/f1f2_en.yaml       # language of entity names and texts: f1f2_en | f1f2_pl
